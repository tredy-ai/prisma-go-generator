# Every commit that lands on main is tested. If the Conventional Commits since the last vX.Y.Z
# tag call for a release (fix: patch, feat: minor, "!" or BREAKING CHANGE: major), the package is
# published to npmjs.com as @tredy-ai/prisma-go-generator and the commit gets its vX.Y.Z tag.
# release-github.yml takes over from that tag.
#
# npmjs.com trusts this workflow by its file name (trusted publishing): renaming the file means
# updating the trusted publisher on npmjs.com first.
#
# The version lives in git tags. package.json is stamped with it at publish time and never
# committed back, because CI cannot push to main.
#
# A commit message containing [ci skip] or [skip ci] stops GitHub from starting this workflow.
name: Publish to NPM

on:
  push:
    branches: [main]

permissions:
  contents: read

# Back-to-back merges queue, so each run sees the tag the one before it created.
concurrency:
  group: release-npm
  cancel-in-progress: false

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the tags and the commits since the last one

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Prints nothing when no commit since the last tag calls for a release.
      - name: Next version
        id: next
        run: |
          version=$(node scripts/next-version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${version:-no release}"

  publish:
    needs: [test, version]
    if: needs.version.outputs.version != ''
    # npm's trusted publishing only accepts GitHub-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version tag
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `npm publish` builds dist/ through the prepack script, authenticates by OIDC and moves the
      # `latest` dist-tag. Skipped when this version is already on npm, so a run can be re-run.
      - name: Publish to npm
        run: |
          url="https://registry.npmjs.org/@tredy-ai%2fprisma-go-generator/$VERSION"
          status=$(curl -sS -o "$RUNNER_TEMP/published.json" -w '%{http_code}' "$url")
          if [ "$status" = 200 ]; then
            # Published but never tagged, and main has moved on: tagging this commit would be wrong.
            published=$(jq -r '.gitHead // ""' "$RUNNER_TEMP/published.json")
            if [ -n "$published" ] && [ "$published" != "$GITHUB_SHA" ]; then
              echo "::error::$VERSION is on npm, built from $published, but has no tag. Create the tag v$VERSION on that commit, then re-run all jobs so the version is worked out again."
              exit 1
            fi
            echo "$VERSION is already on npm"
            exit 0
          fi
          if [ "$status" != 404 ]; then
            echo "::error::could not tell whether $VERSION is on npm: $url answered $status"
            exit 1
          fi
          npm pkg set version="$VERSION"
          npm publish # public, to npmjs.com: see publishConfig in package.json

      # Tag last, so a tag always points at a version that is on npm. The tag is what the next
      # run counts commits from, and what release-github.yml publishes.
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent
