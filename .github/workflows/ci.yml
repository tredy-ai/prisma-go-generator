# Typecheck, unit tests, a real `prisma generate` over the test schema, and the examples:
# regenerated, compared with what is committed, then compiled, vetted and tested with Go.
# Runs on every pull request; release.yml calls it for each commit that lands on main.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # The crud-inputs example and the e2e fixture import the standard library uuid package (Go 1.27).
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.54.0

      # enumer is built by `task tools`, at the version pinned in Taskfile.yml.
      - name: Install dependencies
        run: task install

      - name: Check
        run: task ci
